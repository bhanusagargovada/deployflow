{% extends 'base.html' %}
{% block title %}Profile - {{ user.username }}{% endblock %}
{% block content %}
<h3>{{ user.username }}</h3>
<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Role:</strong> {{ user.role }}</p>
<a class="btn btn-primary" href="{{ url_for('profile.edit_profile') }}">Edit Profile</a>
{% endblock %}
