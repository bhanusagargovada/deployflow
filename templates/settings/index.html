{% extends 'base.html' %}
{% block title %}DeployFlow | Intelligent Project &amp; Deployment Management Platform{% endblock %}
{% block content %}
<h3>DeployFlow Settings</h3>
<form method="post">
  <div class="mb-3 form-check">
    <input class="form-check-input" type="checkbox" id="darktheme" name="darktheme">
    <label class="form-check-label" for="darktheme">Enable dark theme (DeployFlow placeholder)</label>
  </div>
  <button class="btn btn-primary">Save Settings</button>
</form>
{% endblock %}
