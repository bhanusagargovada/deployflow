version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: project_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    command: gunicorn -b 0.0.0.0:5000 run:app --workers 3
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URI=mysql+pymysql://tracker:example@db:3306/project_tracker
      - SECRET_KEY=replace-with-secret
    depends_on:
      - db

volumes:
  db_data:
